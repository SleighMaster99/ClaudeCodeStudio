<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaudeCodeStudio</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app">
    <nav class="tabbar">
      <div class="brand">ClaudeCodeStudio</div>
      <button class="tab active" data-tab="sync">설정 동기화</button>
      <button class="tab" data-tab="statusbar">상태바 설정</button>
      <button class="tab tab-settings" data-tab="settings">⚙ 설정</button>
    </nav>
    <main class="content">
      <section class="pane active" id="pane-sync">
        <iframe id="frame-sync" class="module-frame" src="sync/index.html"></iframe>
      </section>
      <section class="pane" id="pane-statusbar">
        <iframe id="frame-statusbar" class="module-frame" src="statusbar/index.html"></iframe>
      </section>
      <section class="pane" id="pane-settings">
        <div class="settings">
          <div class="settings-inner">
            <h2 class="settings-title">화면 설정</h2>
            <p class="settings-desc">UI 글자 크기와 글꼴을 조절합니다. 변경은 모든 탭에 즉시 적용됩니다.</p>

            <div class="set-row">
              <label class="set-label" for="fontScale">글자 크기</label>
              <div class="set-control">
                <input type="range" id="fontScale" min="16" max="29" step="1">
                <span id="fontScaleVal" class="set-val">18px</span>
              </div>
            </div>

            <div class="set-row">
              <label class="set-label" for="fontFamily">글꼴</label>
              <div class="set-control">
                <input id="fontFamily" class="set-input" list="fontList"
                       placeholder="시스템 기본 — 입력해 검색하거나 목록에서 선택"
                       autocomplete="off" spellcheck="false">
                <datalist id="fontList"></datalist>
                <button id="fontClear" class="set-btn" type="button" title="시스템 기본 글꼴로">지우기</button>
              </div>
            </div>

            <div class="set-actions">
              <button id="settingsReset" class="set-btn">기본값으로</button>
            </div>

            <p class="settings-note">글자 크기는 텍스트에만 적용되어 여백은 유지됩니다. 글꼴은 이 PC 에 설치된 글꼴을 입력·검색해 고를 수 있고, 미리보기·코드 표시를 포함한 전체에 적용됩니다. 설정은 이 PC 에 저장됩니다.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ----- 좌측 탭 전환 -----
    var tabs  = document.querySelectorAll('.tab');
    var panes = document.querySelectorAll('.pane');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.classList.remove('active'); });
        panes.forEach(function (p) { p.classList.remove('active'); });
        tab.classList.add('active');
        var pane = document.getElementById('pane-' + tab.dataset.tab);
        if (pane) pane.classList.add('active');
      });
    });

    // ----- 메시지 중계: 모듈 iframe <-> C++ 호스트 -----
    var wv = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
    var frames = {
      sync: document.getElementById('frame-sync'),
      statusbar: document.getElementById('frame-statusbar')
    };

    // 모듈 iframe 이 부모로 보낸 요청 객체 -> C++ (JSON 문자열)
    window.addEventListener('message', function (e) {
      if (!wv || !e.data || typeof e.data !== 'object') return;
      for (var k in frames) {
        if (frames[k] && e.source === frames[k].contentWindow) {
          wv.postMessage(JSON.stringify(e.data));
          return;
        }
      }
    });

    // C++ 결과 봉투 {module,payload} -> 해당 모듈 iframe 으로 payload 중계
    if (wv) {
      wv.addEventListener('message', function (e) {
        var env;
        try { env = (typeof e.data === 'string') ? JSON.parse(e.data) : e.data; } catch (_) { return; }
        if (!env || !env.module) return;
        var f = frames[env.module];
        if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify(env.payload), '*');
      });
    }

    // ----- 화면 설정 (글자 크기 / 글꼴) -----
    // 셸과 모듈 iframe 은 같은 출처라 부모가 각 문서에 직접 스타일을 주입한다.
    //   글자 크기: 각 문서 root(html) 의 font-size(px) 를 직접 지정 → 모든 rem 글자가 비례 확대(여백 px 유지).
    //   글꼴    : 각 문서에 폰트 오버라이드 <style> 을 주입(미리보기·코드 포함 전체 적용).
    var SETTINGS_KEY = 'ccs.ui.settings.v1';
    var DEFAULT_PX = 18;               // 기본 글자 크기(키워둠). rem 의 기준 root font-size(px)
    var PX_MIN = 16, PX_MAX = 29;

    function clampPx(v) { return Math.min(PX_MAX, Math.max(PX_MIN, Math.round(v))); }
    // 저장/입력값에서 앞뒤 따옴표 제거 (글꼴명 원형으로 보관)
    function stripQuotes(s) { return (s || '').replace(/^\s*['"]?|['"]?\s*$/g, ''); }

    function loadSettings() {
      try {
        var s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
        if (s) {
          var px = null;
          if (typeof s.rootPx === 'number') px = s.rootPx;
          else if (typeof s.scale === 'number') px = 16 * s.scale;   // 구버전(% 배율) 저장값 마이그레이션
          var font = (typeof s.font === 'string') ? stripQuotes(s.font) : '';
          if (px != null) return { rootPx: clampPx(px), font: font };
        }
      } catch (_) {}
      return { rootPx: DEFAULT_PX, font: '' };
    }
    function saveSettings() {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) {}
    }
    var settings = loadSettings();

    // 공백 포함 글꼴명을 큰따옴표로 감싸 CSS 에 안전하게 넣는다
    function cssFont(name) { return '"' + String(name).replace(/"/g, '') + '"'; }

    // 한 문서(셸 또는 모듈 iframe)에 현재 설정을 적용
    function applyToDoc(doc) {
      if (!doc || !doc.documentElement) return;
      doc.documentElement.style.fontSize = settings.rootPx + 'px';
      var st = doc.getElementById('ccs-ui-style');
      if (!st) {
        st = doc.createElement('style'); st.id = 'ccs-ui-style';
        (doc.head || doc.documentElement).appendChild(st);
      }
      st.textContent = settings.font ? ('*{font-family:' + cssFont(settings.font) + ' !important;}') : '';
    }
    function applyAll() {
      applyToDoc(document);                    // 셸 자신
      for (var k in frames) {
        var f = frames[k];
        try { if (f && f.contentDocument) applyToDoc(f.contentDocument); } catch (_) {}
      }
    }

    // ----- 설정 컨트롤 -----
    var elScale = document.getElementById('fontScale');
    var elScaleVal = document.getElementById('fontScaleVal');
    var elFont = document.getElementById('fontFamily');
    var elFontClear = document.getElementById('fontClear');
    var elFontList = document.getElementById('fontList');

    // 설치된 시스템 글꼴을 검색용 datalist 로 채운다 (C++ 가 window.__ccsFonts 로 주입)
    function populateSystemFonts() {
      var sys = (window.__ccsFonts && window.__ccsFonts.length) ? window.__ccsFonts : [];
      elFontList.innerHTML = '';
      for (var i = 0; i < sys.length; i++) {
        var o = document.createElement('option');
        o.value = sys[i];
        elFontList.appendChild(o);
      }
    }

    function syncControls() {
      elScale.value = settings.rootPx;
      elScaleVal.textContent = settings.rootPx + 'px';
      elFont.value = settings.font;            // 빈 값 = 시스템 기본
    }

    elScale.addEventListener('input', function () {
      settings.rootPx = clampPx(parseInt(elScale.value, 10) || DEFAULT_PX);
      elScaleVal.textContent = settings.rootPx + 'px';
      applyAll(); saveSettings();
    });
    // 입력/선택 즉시 반영 (검색해 고르거나 직접 타이핑 모두 input 이벤트로 들어온다)
    elFont.addEventListener('input', function () {
      settings.font = elFont.value.trim();
      applyAll(); saveSettings();
    });
    elFontClear.addEventListener('click', function () {
      settings.font = '';
      elFont.value = '';
      applyAll(); saveSettings();
      elFont.focus();
    });
    document.getElementById('settingsReset').addEventListener('click', function () {
      settings = { rootPx: DEFAULT_PX, font: '' };
      syncControls(); applyAll(); saveSettings();
    });

    // 모듈 iframe 이 (재)로드될 때마다 설정을 다시 주입 (내부 렌더 후에도 root/폰트 유지)
    for (var fk in frames) {
      (function (f) {
        if (!f) return;
        f.addEventListener('load', function () {
          try { applyToDoc(f.contentDocument); } catch (_) {}
        });
      })(frames[fk]);
    }

    // 초기 적용
    populateSystemFonts();
    syncControls();
    applyAll();
  </script>
</body>
</html>
