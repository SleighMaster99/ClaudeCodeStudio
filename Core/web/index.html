<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaudeCodeStudio</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app">
    <nav class="tabbar">
      <div class="brand">ClaudeCodeStudio</div>
      <button class="tab active" data-tab="sync">설정 동기화</button>
      <button class="tab" data-tab="statusbar">상태바 설정</button>
    </nav>
    <main class="content">
      <section class="pane active" id="pane-sync">
        <iframe id="frame-sync" class="module-frame" src="sync/index.html"></iframe>
      </section>
      <section class="pane" id="pane-statusbar">
        <div class="placeholder">
          <h2>상태바 설정</h2>
          <p>StatusBar 모듈은 P2에서 이식됩니다.</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    // 좌측 탭 전환
    var tabs  = document.querySelectorAll('.tab');
    var panes = document.querySelectorAll('.pane');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.classList.remove('active'); });
        panes.forEach(function (p) { p.classList.remove('active'); });
        tab.classList.add('active');
        var pane = document.getElementById('pane-' + tab.dataset.tab);
        if (pane) pane.classList.add('active');
      });
    });

    // 메시지 중계: 모듈 iframe <-> C++ 호스트
    //   iframe -> (parent postMessage) -> chrome.webview.postMessage(JSON) -> C++
    //   C++ -> chrome.webview message -> iframe.contentWindow.postMessage -> iframe
    var wv = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
    var syncFrame = document.getElementById('frame-sync');

    // 모듈 iframe 이 부모로 보낸 요청 객체를 JSON 문자열로 C++ 에 전달
    window.addEventListener('message', function (e) {
      if (!wv) return;
      if (e.source === syncFrame.contentWindow && e.data && typeof e.data === 'object') {
        wv.postMessage(JSON.stringify(e.data));
      }
    });

    // C++ 결과(JSON 문자열)를 해당 모듈 iframe 으로 중계 (P1: Sync 모듈만)
    if (wv) {
      wv.addEventListener('message', function (e) {
        if (syncFrame && syncFrame.contentWindow) {
          syncFrame.contentWindow.postMessage(e.data, '*');
        }
      });
    }
  </script>
</body>
</html>
