<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상태바 설정</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="editor">
  <header class="toolbar">
    <span class="title">상태바 레이아웃</span>
    <div class="tools">
      <button id="addRow" class="btn">+ 줄 추가</button>
      <button id="reloadBtn" class="btn">되돌리기</button>
      <button id="saveBtn" class="btn">저장</button>
      <button id="applyBtn" class="btn primary">저장 &amp; 적용</button>
    </div>
  </header>

  <div id="toast" class="toast" hidden></div>

  <section class="preview-box">
    <div class="preview-head">미리보기 — 실제 statusLine 모양</div>
    <pre id="preview" class="preview">(레이아웃에 항목을 추가하세요)</pre>
  </section>

  <section class="opts">
    <span class="opts-title">표시 옵션</span>
    <label class="opt">막대 폭
      <input id="optBarW" type="number" min="4" max="40" step="1" value="10">
    </label>
    <label class="opt">주의 색 %
      <input id="optWarn" type="number" min="1" max="99" step="1" value="50">
    </label>
    <label class="opt">위험 색 %
      <input id="optCrit" type="number" min="2" max="100" step="1" value="80">
    </label>
    <label class="opt">아이콘
      <select id="optIcon">
        <option value="emoji">이모지</option>
        <option value="nerd">Nerd Font</option>
      </select>
    </label>
    <label class="opt">실행 셸
      <select id="optShell">
        <option value="powershell">powershell (기본)</option>
        <option value="pwsh">pwsh (PowerShell 7)</option>
      </select>
    </label>
    <span class="opts-hint">저장 &amp; 적용 시 함께 반영됩니다. 사용률 막대의 폭과 색 기준(주의/위험 %), 아이콘 글리프(Nerd Font 는 터미널 폰트가 Nerd Font 일 때만 표시), statusLine 실행 셸을 바꿉니다.</span>
  </section>

  <div class="main">
    <aside class="palette">
      <div class="palette-head">항목 팔레트 — 오른쪽 줄로 끌어다 놓기</div>
      <div id="paletteBody" class="palette-body"></div>
    </aside>
    <div id="splitter" class="splitter" title="드래그하여 팔레트/레이아웃 너비 조절"></div>
    <section class="canvas">
      <div class="canvas-head">레이아웃 — 칩을 끌어 순서 변경, ×로 삭제. <b>text</b>는 더블클릭해 편집</div>
      <div id="rows" class="rows"></div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
